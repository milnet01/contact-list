name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ruff, mypy and djlint are CI/dev tools, not app runtime deps, so
          # they live here rather than in requirements.txt. Config is in
          # pyproject.toml.
          pip install 'ruff~=0.16.1' 'mypy~=2.1' 'djlint~=1.46'

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy

      - name: Lint templates (djlint)
        run: djlint templates --lint

      - name: Test (pytest)
        run: pytest

  # The browser script needs Node, not Python, so it is one job rather than a
  # row of the Python matrix (CL-0077). Dev-only: nothing here ships.
  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Lint JavaScript (eslint)
        run: npx --no-install eslint static/
