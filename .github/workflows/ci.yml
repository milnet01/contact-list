name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this whole workflow first, so a tag cannot publish
  # binaries without the checks having run on that commit (CL-0078).
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The step list lives in scripts/gate.sh, which local-ci.sh runs too, so
      # the two cannot drift (local-gate.md § 3).
      - name: Checks (ruff, mypy, djlint, pytest)
        run: scripts/gate.sh python

  # The browser script needs Node, not Python, so it is one job rather than a
  # row of the Python matrix (CL-0077). Dev-only: nothing here ships.
  js-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Lint JavaScript (eslint)
        run: scripts/gate.sh js
