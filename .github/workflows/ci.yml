name: CI

on:
  push:
    branches: [main]
    # The same list .githooks/pre-push treats as documentation: nothing in
    # scripts/gate.sh reads these. Push only -- a pull request runs everything.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  # release.yml calls this whole workflow first, so a tag cannot publish
  # binaries without the checks having run on that commit (CL-0078).
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch cancels the older run -- except on main and on
# tags, where a cancelled run would hide which commit broke (local-gate.md § 9).
# The event is in the key so a push and a pull request never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    # About 50 s warm; sized for a cold pip cache.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The step list lives in scripts/gate.sh, which local-ci.sh runs too, so
      # the two cannot drift (local-gate.md § 3).
      - name: Checks (ruff, mypy, djlint, pytest)
        run: scripts/gate.sh python

  # The browser script needs Node, not Python, so it is one job rather than a
  # row of the Python matrix (CL-0077). Dev-only: nothing here ships.
  js-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Lint JavaScript (eslint)
        run: scripts/gate.sh js
