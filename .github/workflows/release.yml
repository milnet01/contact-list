name: Release binaries

on:
  push:
    tags: ['v*']
  # A manual run is always a rehearsal: it builds all three launchers, but the
  # release job is gated on a v* tag ref (see its `if:`), so workflow_dispatch
  # never publishes a Release. Only pushing a v* tag releases.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # config.py names packaging/check-version-drift.sh as the thing that enforces
  # version lockstep, and until now NOTHING committed invoked it -- its only
  # caller was .claude/bump.json, which .gitignore excludes, so the script was
  # absent from every clone and the enforcement existed on one machine. Running
  # it here, ahead of the builds, is what makes the claim true: a v* tag whose
  # APP_VERSION disagrees with the top CHANGELOG heading now fails before any
  # binary is produced, instead of publishing a mislabelled release.
  version-lockstep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version lockstep (config.py vs CHANGELOG)
        run: bash packaging/check-version-drift.sh
      - name: Tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code=$(grep -oE "APP_VERSION = '([0-9]+\.[0-9]+\.[0-9]+)'" config.py \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$tag" != "$code" ]; then
            echo "drift: tag v$tag != config.py APP_VERSION $code" >&2
            exit 1
          fi
          echo "tag v$tag matches APP_VERSION $code"

  build-linux:
    needs: version-lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # appindicator tray needs the Ayatana/GI/GTK stack at build time so
      # PyInstaller can bundle it; desktop-file-utils is for appimagetool.
      - name: Install AppIndicator/GI build stack
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 \
            libgirepository-1.0-1 gir1.2-glib-2.0 python3-gi libgtk-3-0 \
            gir1.2-gtk-3.0 gir1.2-freedesktop \
            python3-pip python3-venv
      # Build under a venv created with --system-site-packages: it inherits the
      # system python3-gi (so PyInstaller can bundle the appindicator backend)
      # while installing OUR deps into its own site-packages. This avoids the
      # `sudo pip` clash with Ubuntu's Debian-managed packages (e.g. blinker has
      # no pip RECORD, so it can't be upgraded in system Python) — see spec §6.1.
      - name: Build the AppImage with a gi-capable venv
        run: |
          python3 -m venv --system-site-packages build-venv
          build-venv/bin/pip install -r requirements.txt pyinstaller
          PYTHON="$PWD/build-venv/bin/python" bash packaging/build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: Contact-List-x86_64.AppImage

  build-windows:
    needs: version-lockstep
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # tzdata supplies the zone database Windows does not ship; see the note in
      # packaging/contact-list.spec. Build-time only, so it is not a runtime
      # dependency and does not count against DESIGN.md §3's 8-package budget.
      - run: pip install -r requirements.txt pyinstaller tzdata
      - run: bash packaging/make-icons.sh
      - run: pyinstaller --noconfirm packaging/contact-list.spec
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Contact-List.exe

  build-macos:
    needs: version-lockstep
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller
      - run: bash packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Contact-List.dmg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    # Both halves are load-bearing. The ref test alone does not check for `v`,
    # and it is satisfied by a workflow_dispatch run launched against a tag ref
    # -- the Actions UI ref picker offers tags -- so a manual "rehearsal" on
    # v1.1.0 would have re-published that release, which the header comment
    # above says can never happen.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
      # SHA-pinned, unlike the actions/* above. This is the one third-party
      # action in the tree: a mutable tag here can be moved by someone outside
      # GitHub, and it runs in the job holding contents: write. The GitHub-owned
      # actions stay on major tags so they keep receiving fixes, which is the
      # trade DESIGN.md §3's "dependencies track latest" asks for. Bump this
      # deliberately: resolve the tag's commit with
      #   gh api repos/softprops/action-gh-release/git/ref/tags/<tag>
      # then dereference the tag object it returns.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            linux/Contact-List-x86_64.AppImage
            windows/Contact-List.exe
            macos/Contact-List.dmg
