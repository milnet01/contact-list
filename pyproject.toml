# Tool configuration for the Contact List app.
#
# This is a self-hosted Flask app launched via ./run.sh, not a distributable
# package, so there is intentionally no [project] / [build-system] table. This
# file exists only so linting, type-checking, and test settings are identical
# between local runs and CI (CL-0030).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's historical default set, stated explicitly rather than inherited (CL-0062).
# Ruff 0.16 widened its implicit default, so an unset `select` silently changed the
# lint contract on a routine tool bump: 0.15 passed clean, 0.16 raised 35 findings
# across 16 rules nobody had opted into. Pinning the set keeps tool upgrades a
# version decision instead of a code-review decision. Widening it is deliberate
# work, tracked as CL-0062 — not something a dependency bump should do by itself.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
warn_redundant_casts = true
warn_unused_ignores = true
# Ignore build outputs (present locally after a packaging build; absent in CI).
# Without this, the bundled google/ copies under dist/ and build/ trip mypy's
# duplicate-module check on a dev machine that has run packaging/build-linux.sh.
exclude = '^(dist|build)/'
# Every production module, deliberately. This list omitted importer.py,
# photos.py, server_control.py, tray.py and vcard.py until CL-0076 -- so the two
# modules that parse untrusted text (importer, vcard) were the two nothing had
# ever type-checked, while CLAUDE.md requires type hints on all signatures.
# A new module belongs here on the day it is written.
files = [
    "app.py",
    "browser.py",
    "config.py",
    "db.py",
    "google_auth.py",
    "google_sync.py",
    "importer.py",
    "launcher.py",
    "models.py",
    "phoneutil.py",
    "photos.py",
    "resources.py",
    "server_control.py",
    "settings.py",
    "tray.py",
    "vcard.py",
    "routes",
]

# The Google client libraries ship no type stubs or py.typed marker.
[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*", "googleapiclient.*"]
ignore_missing_imports = true

# pystray (CL-0052 tray icon) ships no type stubs or py.typed marker either.
[[tool.mypy.overrides]]
module = ["pystray.*"]
ignore_missing_imports = true
